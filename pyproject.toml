[build-system]
requires = ["hatchling==1.29.0"]
build-backend = "hatchling.build"

[project]
name = "turtlebot"
version = "1.0.0"
description = "Turtle/Donchian breakout trading bot for Interactive Brokers paper accounts, with a SQLite-backed state store and a real-time dashboard."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
authors = [{ name = "WenjaDebug" }]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Typing :: Typed",
    "Private :: Do Not Upload",
]
dependencies = [
    "ib_async==2.1.0",
    "pandas==3.0.6",
    "numpy==2.5.4",
    "yfinance==1.7.0",
    "requests==2.34.2",
    "lxml==6.1.3",
    "pydantic==2.14.1",
    "pydantic-settings==2.16.0",
    "fastapi==0.143.3",
    "uvicorn[standard]==0.54.0",
]

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
    "pytest-cov==7.1.0",
    "httpx2==2.13.1",
    "mypy==2.4.0",
    "pandas-stubs==3.0.5.260914",
    "types-requests==2.33.0.20261006",
    "ruff==0.17.1",
    "black==26.10.1",
    "pre-commit==4.7.0",
]

[project.scripts]
turtlebot = "turtlebot.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/turtlebot"]

# --------------------------------------------------------------------------- tooling
[tool.black]
line-length = 100
target-version = ["py312"]
extend-exclude = "^/(legacy|dashboard)/"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]
extend-exclude = ["legacy", "dashboard"]

[tool.ruff.lint]
select = [
    "E", "W", "F",   # pycodestyle / pyflakes
    "I",             # isort
    "B",             # bugbear
    "UP",            # pyupgrade
    "SIM",           # simplify
    "N",             # pep8-naming
    "D",             # pydocstyle
    "ANN",           # annotations
    "RUF",
    "PT",            # pytest style
    "DTZ",           # timezone-aware datetimes
    "LOG", "G",      # logging hygiene
    "T20",           # no print()
    "S",             # bandit subset
]
ignore = [
    "D105", "D107",  # magic methods / __init__ documented on the class
    "S101",          # assert is fine in tests (re-enabled for src below)
    "S603", "S607",  # subprocess with fixed argv (osascript, claude CLI) is intentional
    "RUF001", "RUF002", "RUF003",  # German umlauts/typographic chars in strings are intended
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D", "ANN", "S", "PLR2004"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
files = ["src", "tests"]
warn_unreachable = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["yfinance", "yfinance.*", "eventkit", "eventkit.*"]
ignore_missing_imports = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers --cov=turtlebot --cov-report=term-missing"
filterwarnings = ["error::pytest.PytestUnraisableExceptionWarning", "error::ResourceWarning"]

[tool.coverage.run]
branch = true
source = ["turtlebot"]
omit = ["src/turtlebot/broker/ibkr.py", "src/turtlebot/data/yahoo.py", "src/turtlebot/__main__.py"]

[tool.coverage.report]
exclude_also = ["if TYPE_CHECKING:", "raise NotImplementedError", "\\.\\.\\."]
