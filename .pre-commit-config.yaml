# Install once with:  pre-commit install
# legacy/ and the old Streamlit dashboard/ are kept verbatim for traceability.
exclude: ^(legacy|dashboard)/
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-yaml
      - id: check-toml
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-added-large-files
        args: ["--maxkb=1024"]
      - id: detect-private-key
      - id: check-merge-conflict

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.1
    hooks:
      - id: ruff-check
        args: ["--fix"]

  - repo: https://github.com/psf/black-pre-commit-mirror
    rev: 26.10.1
    hooks:
      - id: black

  - repo: local
    hooks:
      # Runs the project venv's mypy (activate .venv first) so the pinned stubs are used.
      - id: mypy
        name: mypy --strict
        entry: sh -c 'if [ -x .venv/bin/mypy ]; then .venv/bin/mypy; else mypy; fi'
        language: system
        types: [python]
        pass_filenames: false
      - id: forbid-env-files
        name: forbid committing .env files
        entry: ".env files must never be committed"
        language: fail
        files: '(^|/)\.env(\..*)?$'
        exclude: '\.env\.example$'
